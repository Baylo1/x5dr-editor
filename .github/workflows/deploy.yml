# Deploy: on a published GitHub Release (including pre-releases), test and
# build, publish dist/ to GitHub Pages, then attach dist/index.html to the
# Release (Release Plan A3, D5). The asset is attached only after Pages has
# deployed successfully, so a Release never carries a file the site lacks.
name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${TAG#v}"
          pkg_version=$(node -p "require('./package.json').version")
          echo "Release tag:          $TAG (version $tag_version)"
          echo "package.json version: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Unit tests
        run: npx vitest run

      - name: Build dist/index.html
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Kept separately so the post-deploy job can attach it to the Release.
      - name: Keep index.html for the Release
        uses: actions/upload-artifact@v7
        with:
          name: release-index-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  attach:
    name: Attach index.html to the Release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-index-html
          path: release

      - name: Upload Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/index.html --clobber --repo "$GITHUB_REPOSITORY"
